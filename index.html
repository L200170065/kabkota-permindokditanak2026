<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b66">
  <title>Permintaan Data Daerah AMPK — Kabupaten/Kota</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f2f7fc;color:#172b3f}
    .loading{position:fixed;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center;padding:24px;background:#f2f7fc;z-index:1}
    .spinner{width:34px;height:34px;border:4px solid #d9e5f1;border-top-color:#1769aa;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    iframe{display:block;width:100%;height:100%;min-height:100dvh;border:0;background:#f2f7fc}
    .hint{font-size:13px;color:#60758a;max-width:520px;line-height:1.5}
    .open-link{color:#1769aa;font-weight:700}
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="spinner" aria-hidden="true"></div>
    <strong>Memuat formulir Kabupaten/Kota…</strong>
    <div class="hint">Formulir sedang dibuka dari Google Apps Script.</div>
    <div class="hint"><a class="open-link" id="directLink" href="#" target="_blank" rel="noopener">Buka formulir langsung</a></div>
  </div>
  <iframe id="app" title="Formulir Pendataan AMPK Kabupaten/Kota" allow="clipboard-read; clipboard-write" loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script type="module">
    const appUrl = import.meta.env.VITE_APPS_SCRIPT_URL;
    const frame = document.getElementById('app');
    const loading = document.getElementById('loading');
    const directLink = document.getElementById('directLink');

    if (!appUrl) {
      loading.innerHTML = '<strong>Konfigurasi belum lengkap</strong><div class="hint">Environment Variable VITE_APPS_SCRIPT_URL belum diatur di Vercel. Tambahkan nilainya, lalu redeploy.</div>';
    } else {
      frame.src = appUrl;
      directLink.href = appUrl;
      frame.addEventListener('load', () => { loading.style.display = 'none'; });
      window.setTimeout(() => {
        if (loading.style.display !== 'none') {
          loading.innerHTML = '<strong>Formulir belum tampil</strong><div class="hint">Coba buka formulir langsung. Jika URL langsung juga error, periksa deployment dan akses Google Apps Script.</div><div class="hint"><a class="open-link" href="' + appUrl + '" target="_blank" rel="noopener">Buka formulir langsung</a></div>';
        }
      }, 12000);
    }
  </script>
</body>
</html>

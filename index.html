<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b66">
  <title>Permintaan Data Daerah AMPK — Kabupaten/Kota</title>
<style>
:root{--navy:#123b66;--blue:#1976bd;--pale:#eaf3fb;--ink:#19334c;--muted:#71869a}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
body{overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#fff 0%,#f5f9fd 48%,#eaf3fb 100%)}
.loading-page{height:100%;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;isolation:isolate}
.glow{position:absolute;width:420px;height:420px;border-radius:50%;background:#cfe8ff66;filter:blur(4px);top:50%;left:50%;transform:translate(-50%,-58%);z-index:-1}
.card{width:min(100%,520px);text-align:center;padding:38px 34px 30px;border:1px solid #ffffffd9;border-radius:28px;background:#ffffffc9;box-shadow:0 28px 80px #123b6612,0 3px 12px #123b6608;backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:30px;text-align:left}
.logo{width:48px;height:48px;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#eaf4ff);border:1px solid #dceaf7;border-radius:15px;box-shadow:0 5px 14px #123b6610;overflow:hidden;flex-shrink:0}
.logo img{width:100%;height:100%;object-fit:contain;padding:3px}
.brand-name{font-size:13px;font-weight:800;line-height:1.4;color:#123b66}
.brand-sub{font-size:11px;color:#72869a;margin-top:3px}
.spinner-wrap{width:78px;height:78px;margin:0 auto 25px;position:relative;display:grid;place-items:center}
.spinner{width:68px;height:68px;border:5px solid #dbe9f6;border-top-color:#1976bd;border-right-color:#55a5df;border-radius:50%;animation:spin 1s cubic-bezier(.5,.1,.5,.9) infinite}
.spinner-core{position:absolute;width:30px;height:30px;border-radius:10px;background:linear-gradient(145deg,#1976bd,#123b66);display:grid;place-items:center;box-shadow:0 6px 16px #1976bd35}
.spinner-core svg{width:17px;height:17px;stroke:#fff}
h1{font-size:clamp(23px,4vw,29px);letter-spacing:-.035em;line-height:1.2;margin:0 0 11px;font-weight:800;color:#173653}
.desc{font-size:14px;line-height:1.7;color:#718398;margin:0 auto;max-width:370px}
.progress{height:5px;background:#e7eff7;border-radius:99px;overflow:hidden;margin:26px auto 13px;max-width:290px}
.progress span{display:block;height:100%;width:38%;border-radius:99px;background:linear-gradient(90deg,#1976bd,#79c4f2);animation:travel 1.8s ease-in-out infinite}
.status{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#3477a9}
.foot{font-size:11px;line-height:1.6;color:#9aabba;margin-top:28px}
.dots:after{content:"";display:inline-block;width:18px;text-align:left;animation:dots 1.4s steps(4,end) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes travel{0%{transform:translateX(-120%)}100%{transform:translateX(360%)}}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%,100%{content:"..."}}
@media(max-width:480px){.card{padding:30px 22px 25px;border-radius:23px}.brand{margin-bottom:26px}.spinner-wrap{margin-bottom:21px}.foot{margin-top:24px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:3s!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="loading-page">
  <div class="glow"></div>
  <section class="card" aria-live="polite">
    <div class="brand">
      <div class="logo"><img src="https://lh3.googleusercontent.com/d/1aSj51L0F0b7YbY4wPunrYgYgpuOZJUlW" alt="Logo Direktorat Rehabilitasi Sosial Anak" onerror="this.style.display='none'"></div>
      <div><div class="brand-name">DIREKTORAT REHABILITASI SOSIAL ANAK</div><div class="brand-sub">Kementerian Sosial Republik Indonesia</div></div>
    </div>
    <div class="spinner-wrap" aria-hidden="true">
      <div class="spinner"></div>
      <div class="spinner-core"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V7l8-4 8 4v13M2 20h20M8 10h2m4 0h2m-8 4h2m4 0h2"/></svg></div>
    </div>
    <h1>Menyiapkan Formulir AMPK</h1>
    <p class="desc">Mohon tunggu sebentar. Formulir pendataan AMPK Kabupaten/Kota sedang disiapkan untuk Anda.</p>
    <div class="progress" role="progressbar" aria-label="Formulir sedang dimuat"><span></span></div>
    <div class="status">Menghubungkan ke sistem<span class="dots"></span></div>
    <div class="foot">Pendataan AMPK Kabupaten/Kota · 2026<br>Rehsos Anak Selalu Ada Untuk Anak</div>
  </section>
</main>
  <iframe id="app" title="Formulir Pendataan AMPK Kabupaten/Kota" allow="clipboard-read; clipboard-write" loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script type="module">
    const appUrl = import.meta.env.VITE_APPS_SCRIPT_URL;
    const frame = document.getElementById('app');
    const loading = document.getElementById('loading');
    const directLink = document.getElementById('directLink');

    if (!appUrl) {
      loading.innerHTML = '<strong>Konfigurasi belum lengkap</strong><div class="hint">Environment Variable VITE_APPS_SCRIPT_URL belum diatur di Vercel. Tambahkan nilainya, lalu redeploy.</div>';
    } else {
      frame.src = appUrl;
      directLink.href = appUrl;
      frame.addEventListener('load', () => { loading.style.display = 'none'; });
      window.setTimeout(() => {
        if (loading.style.display !== 'none') {
          loading.innerHTML = '<strong>Formulir belum tampil</strong><div class="hint">Coba buka formulir langsung. Jika URL langsung juga error, periksa deployment dan akses Google Apps Script.</div><div class="hint"><a class="open-link" href="' + appUrl + '" target="_blank" rel="noopener">Buka formulir langsung</a></div>';
        }
      }, 12000);
    }
  </script>
</body>
</html>
